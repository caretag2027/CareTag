version: '3.8'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geofence
    volumes:
      - geofence-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      - ConnectionStrings__GeoFenceDb=Host=db;Port=5432;Database=geofence;Username=postgres;Password=postgres
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db
    ports:
      - "5077:5077"

  caretag-scorer:
    build:
      context: ./caretag-scorer
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - "C:/Users/Gunee/Downloads/CareTag/outputs/models:/app/models:ro"
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  geofence-data:
