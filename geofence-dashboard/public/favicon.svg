<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    :root {
      --blue-stop-1: #0B2D5B;
      --blue-stop-2: #2563EB;
      --blue-stop-3: #1D4ED8;
      --teal-stop-1: #0D9488;
      --teal-stop-2: #14B8A6;
      --teal-stop-3: #5EEAD4;
      --heart-color: #FFFFFF;
      --shadow-opacity: 0.16;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --blue-stop-1: #2563EB;
        --blue-stop-2: #3B82F6;
        --blue-stop-3: #60A5FA;
        --teal-stop-1: #0D9488;
        --teal-stop-2: #14B8A6;
        --teal-stop-3: #2DD4BF;
        --heart-color: #FFFFFF;
        --shadow-opacity: 0.35;
      }
    }
  </style>
  <defs>
    <linearGradient id="ct-fav-blue" x1="15%" y1="10%" x2="50%" y2="90%">
      <stop offset="0%" stop-color="var(--blue-stop-1)" />
      <stop offset="55%" stop-color="var(--blue-stop-2)" />
      <stop offset="100%" stop-color="var(--blue-stop-3)" />
    </linearGradient>
    <linearGradient id="ct-fav-teal" x1="60%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="var(--teal-stop-1)" />
      <stop offset="60%" stop-color="var(--teal-stop-2)" />
      <stop offset="100%" stop-color="var(--teal-stop-3)" />
    </linearGradient>
    <filter id="ct-fav-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="var(--shadow-opacity)" />
    </filter>
  </defs>

  <g filter="url(#ct-fav-shadow)">
    <!-- Top Left Pin Cap (Navy/Blue) -->
    <circle cx="34" cy="22" r="10.5" fill="url(#ct-fav-blue)" />
    <!-- Top Right Pin Cap (Teal) -->
    <circle cx="66" cy="26" r="9" fill="url(#ct-fav-teal)" />
    <!-- Left Wing / Outer Lobe -->
    <path
      d="M 33 36 C 16 41, 6 55, 12 72 C 18 86, 34 94, 50 97 C 40 88, 30 76, 30 65 C 30 52, 38 46, 46 53 C 41 44, 38 39, 33 36 Z"
      fill="url(#ct-fav-blue)"
    />
    <!-- Right Wing / Outer Lobe -->
    <path
      d="M 66 38 C 77 43, 88 53, 86 67 C 84 79, 71 89, 50 97 C 58 87, 65 77, 65 67 C 65 57, 58 53, 50 61 C 56 49, 61 42, 66 38 Z"
      fill="url(#ct-fav-teal)"
    />
    <!-- Center Heart Negative Space -->
    <path
      d="M 50 56 C 46 51, 39 52, 39 58 C 39 65, 47 71, 50 75 C 53 71, 61 65, 61 58 C 61 52, 54 51, 50 56 Z"
      fill="var(--heart-color)"
    />
  </g>
</svg>
