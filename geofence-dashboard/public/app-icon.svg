<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="ct-app-bg" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stopColor="#0B2D5B" />
      <stop offset="45%" stopColor="#1E40AF" />
      <stop offset="100%" stopColor="#2563EB" />
    </linearGradient>
    <linearGradient id="ct-app-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#14B8A6" />
      <stop offset="100%" stopColor="#5EEAD4" />
    </linearGradient>
    <filter id="ct-app-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle container with brand gradient -->
  <rect width="128" height="128" rx="28" fill="url(#ct-app-bg)" />
  <!-- Inner subtle border for premium feel -->
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- CareTag symbol inside -->
  <g transform="translate(14, 14) scale(1)" filter="url(#ct-app-glow)">
    <!-- Top Left Pin Cap (White) -->
    <circle cx="34" cy="22" r="10.5" fill="#FFFFFF" />
    <!-- Top Right Pin Cap (Teal) -->
    <circle cx="66" cy="26" r="9" fill="url(#ct-app-teal)" />
    <!-- Left Wing (White) -->
    <path
      d="M 33 36 C 16 41, 6 55, 12 72 C 18 86, 34 94, 50 97 C 40 88, 30 76, 30 65 C 30 52, 38 46, 46 53 C 41 44, 38 39, 33 36 Z"
      fill="#FFFFFF"
    />
    <!-- Right Wing (Teal) -->
    <path
      d="M 66 38 C 77 43, 88 53, 86 67 C 84 79, 71 89, 50 97 C 58 87, 65 77, 65 67 C 65 57, 58 53, 50 61 C 56 49, 61 42, 66 38 Z"
      fill="url(#ct-app-teal)"
    />
    <!-- Center Heart Negative Space (Brand Navy Accent) -->
    <path
      d="M 50 56 C 46 51, 39 52, 39 58 C 39 65, 47 71, 50 75 C 53 71, 61 65, 61 58 C 61 52, 54 51, 50 56 Z"
      fill="#0B2D5B"
    />
  </g>
</svg>
